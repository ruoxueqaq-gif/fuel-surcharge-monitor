name: 燃油CSV中文表头迁移与验证（一次性）

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chinese-headers-validate-once.yml"

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 更新 CSV 生成逻辑与测试
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent

          monitor_path = Path("src/monitor.py")
          text = monitor_path.read_text(encoding="utf-8")

          marker = 'MONITORED_ROUTE = "中国大陆-日本（中国大陆始发）"\n'
          constants = dedent('''\
          MONITORED_ROUTE = "中国大陆-日本（中国大陆始发）"
          HISTORY_FIELDS = (
              "record_id", "announced_at", "effective_start", "effective_end", "route",
              "one_way_amount_cny", "round_trip_amount_cny", "currency", "change_vs_previous_cny",
          )
          HISTORY_HEADERS = {
              "record_id": "记录编号",
              "announced_at": "公布日期",
              "effective_start": "适用开始日期",
              "effective_end": "适用结束日期",
              "route": "航线",
              "one_way_amount_cny": "单程燃油附加费（人民币）",
              "round_trip_amount_cny": "往返燃油附加费（人民币）",
              "currency": "币种",
              "change_vs_previous_cny": "较上周期涨跌（人民币）",
          }
          ''')
          if "HISTORY_HEADERS =" not in text:
              assert marker in text
              text = text.replace(marker, constants, 1)

          history_block = dedent('''\
          def _history_value(row: dict[str, str], key: str) -> str:
              return row.get(HISTORY_HEADERS[key], row.get(key, ""))


          def load_history() -> list[dict]:
              records: list[dict] = []
              for airline, path in HISTORY_FILES.items():
                  if not path.exists() or path.stat().st_size == 0:
                      continue
                  grouped: dict[str, dict] = {}
                  with path.open("r", encoding="utf-8-sig", newline="") as stream:
                      for row in csv.DictReader(stream):
                          record_id = _history_value(row, "record_id")
                          record = grouped.setdefault(
                              record_id,
                              {
                                  "id": record_id,
                                  "airline": airline,
                                  "airline_name": AIRLINE_NAMES[airline],
                                  "announced_at": _history_value(row, "announced_at") or None,
                                  "effective_start": _history_value(row, "effective_start"),
                                  "effective_end": _history_value(row, "effective_end"),
                                  "currency": _history_value(row, "currency") or "CNY",
                                  "unit": "每位旅客、每航段、单程",
                                  "amounts": [],
                                  "source_url": SOURCES[airline],
                              },
                          )
                          one_way = int(_history_value(row, "one_way_amount_cny"))
                          record["amounts"].append(
                              {
                                  "route": _history_value(row, "route"),
                                  "one_way_amount_cny": one_way,
                                  "round_trip_amount_cny": int(_history_value(row, "round_trip_amount_cny")),
                              }
                          )
                  records.extend(grouped.values())
              return records


          def append_history(records: list[dict]) -> None:
              if not records:
                  return
              fieldnames = [HISTORY_HEADERS[field] for field in HISTORY_FIELDS]
              for airline, path in HISTORY_FILES.items():
                  selected = sorted(
                      (record for record in records if record["airline"] == airline),
                      key=lambda record: (record["effective_start"], record["id"]),
                  )
                  if not selected:
                      continue
                  previous_by_route: dict[str, int] = {}
                  if path.exists() and path.stat().st_size:
                      with path.open("r", encoding="utf-8-sig", newline="") as stream:
                          for row in csv.DictReader(stream):
                              route = _history_value(row, "route")
                              amount = _history_value(row, "one_way_amount_cny")
                              if route and amount:
                                  previous_by_route[route] = int(amount)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  needs_header = not path.exists() or path.stat().st_size == 0
                  with path.open("a", encoding="utf-8-sig", newline="") as stream:
                      writer = csv.DictWriter(stream, fieldnames=fieldnames)
                      if needs_header:
                          writer.writeheader()
                      for record in selected:
                          for amount in record["amounts"]:
                              route = amount["route"]
                              current = int(amount["one_way_amount_cny"])
                              previous = previous_by_route.get(route)
                              change = "" if previous is None or current == previous else f"{current - previous:+d}"
                              output = {
                                  "record_id": record["id"],
                                  "announced_at": record["announced_at"] or "",
                                  "effective_start": record["effective_start"],
                                  "effective_end": record["effective_end"],
                                  "route": route,
                                  "one_way_amount_cny": current,
                                  "round_trip_amount_cny": amount["round_trip_amount_cny"],
                                  "currency": record["currency"],
                                  "change_vs_previous_cny": change,
                              }
                              writer.writerow({HISTORY_HEADERS[key]: value for key, value in output.items()})
                              previous_by_route[route] = current
          ''')
          text, count = re.subn(
              r"def load_history\(\) -> list\[dict\]:\n.*?\n\ndef load_state",
              history_block.rstrip() + "\n\ndef load_state",
              text,
              flags=re.S,
          )
          assert count == 1, count
          compile(text, str(monitor_path), "exec")
          monitor_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_monitor.py")
          tests = test_path.read_text(encoding="utf-8")
          old = '''    assert reader.fieldnames == [\n        "record_id", "announced_at", "effective_start", "effective_end", "route",\n        "one_way_amount_cny", "round_trip_amount_cny", "currency", "change_vs_previous_cny",\n    ]\n    assert [row["change_vs_previous_cny"] for row in rows] == ["", "", "+55", "-20"]\n    assert "unit" not in reader.fieldnames\n    assert "source_url" not in reader.fieldnames\n'''
          new = '''    assert reader.fieldnames == [\n        "记录编号", "公布日期", "适用开始日期", "适用结束日期", "航线",\n        "单程燃油附加费（人民币）", "往返燃油附加费（人民币）", "币种", "较上周期涨跌（人民币）",\n    ]\n    assert [row["较上周期涨跌（人民币）"] for row in rows] == ["", "", "+55", "-20"]\n    assert all("_" not in name for name in reader.fieldnames)\n    assert "单位" not in reader.fieldnames\n    assert "官方来源链接" not in reader.fieldnames\n'''
          assert old in tests
          test_path.write_text(tests.replace(old, new, 1), encoding="utf-8")
          PY

      - name: 将现有 NH/JL 历史 CSV 改为中文表头
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          fields = [
              ("record_id", "记录编号"),
              ("announced_at", "公布日期"),
              ("effective_start", "适用开始日期"),
              ("effective_end", "适用结束日期"),
              ("route", "航线"),
              ("one_way_amount_cny", "单程燃油附加费（人民币）"),
              ("round_trip_amount_cny", "往返燃油附加费（人民币）"),
              ("currency", "币种"),
              ("change_vs_previous_cny", "较上周期涨跌（人民币）"),
          ]
          for airline in ("NH", "JL"):
              path = Path("data") / f"{airline}.csv"
              with path.open(encoding="utf-8-sig", newline="") as handle:
                  rows = list(csv.DictReader(handle))
              output = []
              for row in rows:
                  converted = {new: row.get(new, row.get(old, "")) for old, new in fields}
                  output.append(converted)
              with path.open("w", encoding="utf-8-sig", newline="") as handle:
                  writer = csv.DictWriter(handle, fieldnames=[new for _, new in fields], lineterminator="\n")
                  writer.writeheader()
                  writer.writerows(output)
          PY

      - name: 安装依赖并运行完整测试
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q

      - name: 验证正式定时工作流仍可识别
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/monitor.yml").read_text(encoding="utf-8")
          assert "schedule:" in text
          assert "workflow_dispatch:" in text
          assert 'timezone: "Asia/Tokyo"' in text
          PY

      - name: 提交中文表头改动
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/monitor.py tests/test_monitor.py data/NH.csv data/JL.csv
          git commit -m "refactor: 燃油附加费 CSV 使用中文表头"
          git pull --rebase origin main
          git push origin HEAD:main
