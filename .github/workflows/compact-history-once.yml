name: Compact surcharge history once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/compact-history-once.yml"

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch history persistence logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent

          path = Path("src/monitor.py")
          text = path.read_text(encoding="utf-8")

          load_history = dedent('''\
          def load_history() -> list[dict]:
              records: list[dict] = []
              for airline, path in HISTORY_FILES.items():
                  if not path.exists() or path.stat().st_size == 0:
                      continue
                  grouped: dict[str, dict] = {}
                  with path.open("r", encoding="utf-8-sig", newline="") as stream:
                      for row in csv.DictReader(stream):
                          record_id = row["record_id"]
                          record = grouped.setdefault(
                              record_id,
                              {
                                  "id": record_id,
                                  "airline": airline,
                                  "airline_name": AIRLINE_NAMES[airline],
                                  "announced_at": row["announced_at"] or None,
                                  "effective_start": row["effective_start"],
                                  "effective_end": row["effective_end"],
                                  "currency": row.get("currency") or "CNY",
                                  "unit": "每位旅客、每航段、单程",
                                  "amounts": [],
                                  "source_url": SOURCES[airline],
                              },
                          )
                          one_way = int(row["one_way_amount_cny"])
                          record["amounts"].append(
                              {
                                  "route": row["route"],
                                  "one_way_amount_cny": one_way,
                                  "round_trip_amount_cny": int(row["round_trip_amount_cny"]),
                              }
                          )
                  records.extend(grouped.values())
              return records
          ''')

          append_history = dedent('''\
          def append_history(records: list[dict]) -> None:
              if not records:
                  return
              fieldnames = [
                  "record_id", "announced_at", "effective_start", "effective_end",
                  "route", "one_way_amount_cny", "round_trip_amount_cny", "currency",
                  "change_vs_previous_cny",
              ]
              for airline, path in HISTORY_FILES.items():
                  selected = sorted(
                      (record for record in records if record["airline"] == airline),
                      key=lambda record: (record["effective_start"], record["id"]),
                  )
                  if not selected:
                      continue
                  previous_by_route: dict[str, int] = {}
                  if path.exists() and path.stat().st_size:
                      with path.open("r", encoding="utf-8-sig", newline="") as stream:
                          for row in csv.DictReader(stream):
                              route = row.get("route", "")
                              amount = row.get("one_way_amount_cny", "")
                              if route and amount:
                                  previous_by_route[route] = int(amount)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  needs_header = not path.exists() or path.stat().st_size == 0
                  with path.open("a", encoding="utf-8-sig", newline="") as stream:
                      writer = csv.DictWriter(stream, fieldnames=fieldnames)
                      if needs_header:
                          writer.writeheader()
                      for record in selected:
                          for amount in record["amounts"]:
                              route = amount["route"]
                              current = int(amount["one_way_amount_cny"])
                              previous = previous_by_route.get(route)
                              change = "" if previous is None or current == previous else f"{current - previous:+d}"
                              writer.writerow(
                                  {
                                      "record_id": record["id"],
                                      "announced_at": record["announced_at"] or "",
                                      "effective_start": record["effective_start"],
                                      "effective_end": record["effective_end"],
                                      "route": route,
                                      "one_way_amount_cny": current,
                                      "round_trip_amount_cny": amount["round_trip_amount_cny"],
                                      "currency": record["currency"],
                                      "change_vs_previous_cny": change,
                                  }
                              )
                              previous_by_route[route] = current
          ''')

          text, n1 = re.subn(
              r"def load_history\(\) -> list\[dict\]:\n.*?\n\ndef append_history",
              load_history.rstrip() + "\n\ndef append_history",
              text,
              flags=re.S,
          )
          text, n2 = re.subn(
              r"def append_history\(records: list\[dict\]\) -> None:\n.*?\n\ndef load_state",
              append_history.rstrip() + "\n\ndef load_state",
              text,
              flags=re.S,
          )
          assert (n1, n2) == (1, 1), (n1, n2)
          compile(text, str(path), "exec")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Rewrite existing NH and JL CSVs
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          fields = [
              "record_id", "announced_at", "effective_start", "effective_end", "route",
              "one_way_amount_cny", "round_trip_amount_cny", "currency", "change_vs_previous_cny",
          ]
          for name in ("NH", "JL"):
              path = Path("data") / f"{name}.csv"
              with path.open(encoding="utf-8-sig", newline="") as stream:
                  rows = list(csv.DictReader(stream))
              previous_by_route = {}
              output = []
              for row in rows:
                  route = row["route"]
                  current = int(row["one_way_amount_cny"])
                  previous = previous_by_route.get(route)
                  change = "" if previous is None or current == previous else f"{current - previous:+d}"
                  output.append({
                      "record_id": row["record_id"],
                      "announced_at": row["announced_at"],
                      "effective_start": row["effective_start"],
                      "effective_end": row["effective_end"],
                      "route": route,
                      "one_way_amount_cny": row["one_way_amount_cny"],
                      "round_trip_amount_cny": row["round_trip_amount_cny"],
                      "currency": row.get("currency") or "CNY",
                      "change_vs_previous_cny": change,
                  })
                  previous_by_route[route] = current
              with path.open("w", encoding="utf-8-sig", newline="") as stream:
                  writer = csv.DictWriter(stream, fieldnames=fields, lineterminator="\n")
                  writer.writeheader()
                  writer.writerows(output)
          PY
      - name: Install and test
        run: |
          pip install -r requirements.txt
          pip install pytest
          python -m pytest -q
      - name: Commit compact history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/monitor.py data/NH.csv data/JL.csv
          git commit -m "refactor: compact surcharge CSV history"
          git pull --rebase origin main
          git push origin HEAD:main
