name: NH/JL 燃油附加费监控

on:
  workflow_dispatch:
  schedule:
    # 偶数月 20、25 日检查；时间为日本时间 09:20。
    - cron: "20 9 20,25 2,4,6,8,10,12 *"
      timezone: "Asia/Tokyo"
    # 若仍未查到，则在下一奇数月 2 日补查。
    - cron: "20 9 2 1,3,5,7,9,11 *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write
  issues: write

concurrency:
  group: fuel-surcharge-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_CHECK: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: python -m pip install -r requirements.txt pytest

      - name: 运行测试
        run: python -m pytest -q

      - name: 检查 NH/JL 官方信息
        run: python -m src.monitor

      - name: 保存新增记录和轮次状态
        run: |
          git config user.name "fuel-surcharge-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data csv reports
          if git diff --cached --quiet; then
            echo "没有需要提交的变化"
          else
            git commit -m "data: 更新 NH/JL 燃油附加费记录"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Deliver pending notifications
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m src.notifications
      - name: Persist pending notifications and acknowledgements
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name "fuel-surcharge-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ csv/ reports/
          if ! git diff --cached --quiet; then
            git commit -m "data: preserve notification delivery state"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Refresh local monitor health
        if: ${{ always() && !cancelled() && inputs.dry_run != true && inputs.live_check != true }}
        env:
          MONITOR_JOB_STATUS: ${{ job.status }}
        run: python scripts/write_health.py
      - name: Preserve monitor reports and recovery state
        if: ${{ always() && !cancelled() && inputs.dry_run != true && inputs.live_check != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ csv/ reports/
          if ! git diff --cached --quiet; then
            git commit -m "data: update monitor health and preserve recovery state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
