name: Refresh focus markers
on:
  schedule:
    # 08:35 Asia/Shanghai; presentation refresh only, no website/API requests.
    - cron: "35 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["01-CSV/**", "02-代码运行/data/**", "02-代码运行/config/**", "02-代码运行/config.yaml", "02-代码运行/preference_config.yaml", "02-代码运行/scripts/**", "02-代码运行/src/review_queue.py"]
permissions:
  contents: write
concurrency:
  group: fuel-surcharge-monitor
  cancel-in-progress: false
defaults:
  run:
    working-directory: 02-代码运行

jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest PyYAML
      - run: python -m pytest -q tests/test_focus_views.py
      - run: python scripts/update_focus.py
      - name: Save changed presentation files
        run: |
          git add ../01-CSV/
          if git diff --cached --quiet; then
            echo "Focus markers unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh focus markers [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
