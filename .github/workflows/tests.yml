name: Validate code and configuration
on:
  push:
    branches: [main]
    paths: ["02-代码运行/src/**", "02-代码运行/tests/**", "02-代码运行/scripts/**", "02-代码运行/config/**", "02-代码运行/*.yaml", "02-代码运行/*.toml", "02-代码运行/requirements*.txt", ".github/workflows/**"]
  pull_request:
    paths: ["02-代码运行/src/**", "02-代码运行/tests/**", "02-代码运行/scripts/**", "02-代码运行/config/**", "02-代码运行/*.yaml", "02-代码运行/*.toml", "02-代码运行/requirements*.txt", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: 02-代码运行

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Validate
        run: |
          python -m pytest -q
