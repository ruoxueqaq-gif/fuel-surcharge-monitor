name: Validate code and configuration
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "scripts/**", "config/**", "*.yaml", "*.toml", "requirements*.txt", ".github/workflows/**"]
  pull_request:
    paths: ["src/**", "tests/**", "scripts/**", "config/**", "*.yaml", "*.toml", "requirements*.txt", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Validate
        run: |
          python -m pytest -q
